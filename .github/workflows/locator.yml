name: 定位工作台
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: collect
        options: [collect, save_plans]
      payload:
        type: string
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: locator-pages
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cloud.txt
      - name: 校验并保存加密计划
        if: ${{ inputs.operation == 'save_plans' }}
        run: |
          python cloud/plan_store.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/plans.enc.json
          git diff --cached --quiet || git commit -m 'Save encrypted device plans'
          git push
        env:
          LOCATOR_PLAN_PAYLOAD: ${{ inputs.payload }}
          LOCATOR_PASSWORD: ${{ secrets.LOCATOR_PASSWORD }}
          LOCATOR_PREVIOUS_PASSWORD: ${{ secrets.LOCATOR_PREVIOUS_PASSWORD }}
      - name: 查询并加密
        id: collect
        continue-on-error: true
        run: python cloud/fetch.py
        env:
          XM_TOKEN: ${{ secrets.XM_TOKEN }}
          XM_UID: ${{ secrets.XM_UID }}
          LOCATOR_PASSWORD: ${{ secrets.LOCATOR_PASSWORD }}
          LOCATOR_PREVIOUS_PASSWORD: ${{ secrets.LOCATOR_PREVIOUS_PASSWORD }}
          XM_PLANS: ${{ secrets.XM_PLANS }}
          XM_MAIL_CONFIG: ${{ secrets.XM_MAIL_CONFIG }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: 保存加密状态供下次查询使用
        if: ${{ steps.collect.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/state.enc.json
          git diff --cached --quiet || git commit -m 'Update encrypted device state'
          git push
      - uses: actions/configure-pages@v5
        id: configure_pages
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        id: upload_pages
        if: ${{ !cancelled() && steps.configure_pages.outcome == 'success' }}
        with:
          path: site
      - name: 发布看板
        id: deployment
        if: ${{ !cancelled() && steps.upload_pages.outcome == 'success' }}
        uses: actions/deploy-pages@v4
      - name: 验证发布数据健康状态
        id: health
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && steps.deployment.outcome == 'success' }}
        run: python cloud/health_check.py
        env:
          LOCATOR_PASSWORD: ${{ secrets.LOCATOR_PASSWORD }}
      - name: 报告采集失败
        if: ${{ always() && (steps.collect.outcome == 'failure' || steps.health.outcome == 'failure') }}
        run: |
          if [ "$COLLECT_OUTCOME" = 'failure' ]; then
            echo '::error::云端采集失败，已尝试发布现有静态看板；历史加密状态未更新。请检查采集日志及小米凭据。'
          else
            echo '::error::发布数据健康检查失败：本轮可能仅保留并重新加密发布了历史位置，不代表获取到新位置。请检查健康检查及采集日志。'
          fi
          exit 1
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
