<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>定位工作台</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e9eef7;background:#0b111b}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:28px 22px 44px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:24px;border-bottom:1px solid #27354a}h1,h2,h3,p{margin:0}h1{font-size:26px;letter-spacing:0}.subtitle{color:#91a2b9;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button,input,textarea{font:inherit;color:inherit;border:1px solid #40516a;background:#172438;border-radius:8px;padding:10px 13px}button{cursor:pointer}button:hover{background:#223550}button.primary{background:#2c79b9;border-color:#4b9cda}.status{margin:22px 0 16px;padding:14px 16px;border-left:3px solid #3d9be0;background:#111d2d;border-radius:8px;color:#bdd0e8}.status.warn{border-color:#e0a24a;color:#ffd797}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 26px}.metric{background:#111c2c;border:1px solid #26374e;border-radius:10px;padding:16px}.metric strong{display:block;font-size:25px;color:#fff}.metric span{color:#91a2b9;font-size:13px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}.section-head p{color:#91a2b9}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.device{background:#111c2c;border:1px solid #2a3b52;border-radius:10px;padding:18px}.device.ok{border-top:3px solid #45b78a}.device.warn{border-top:3px solid #dfa044}.device h3{font-size:18px;margin-bottom:10px}.tag{display:inline-block;padding:3px 8px;border:1px solid #3d526c;border-radius:999px;color:#b7c9df;font-size:12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.fact{padding:10px;background:#0d1725;border-radius:7px}.fact label{display:block;color:#8195ae;font-size:12px;margin-bottom:3px}.fact b{font-weight:500;color:#eaf1fa}.device-foot{margin-top:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}.device-foot a{color:#72c7ff}.muted{color:#8ea1b8}.warn-text{color:#ffd38a}.empty{padding:26px;border:1px dashed #3b4b61;border-radius:10px;color:#a9b9cd}form{max-width:430px;margin:60px auto;padding:26px;background:#111c2c;border:1px solid #2a3b52;border-radius:12px}form h2{margin-bottom:8px}form p{color:#91a2b9;margin-bottom:18px}label{display:block;color:#b7c9df;margin:8px 0 6px}input{width:100%}form button{margin-top:14px;width:100%}dialog{max-width:650px;width:calc(100% - 32px);background:#111c2c;color:#e9eef7;border:1px solid #40516a;border-radius:12px;padding:22px}dialog p{color:#91a2b9;margin:8px 0 14px}textarea{width:100%;min-height:230px}.dialog-actions{display:flex;gap:8px;margin-top:12px}.device-note{margin-top:10px}.plan-summary{margin-top:12px;color:#91a2b9;font-size:13px}[hidden]{display:none!important}@media(max-width:700px){main{padding:20px 14px 35px}header{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr}.toolbar{width:100%}.toolbar button{flex:1}}
</style>
<main><header><div><h1>定位工作台</h1><p class="subtitle">云端定位总览 · 设备关机后仍可查看最近一次成功采集</p></div><div class="toolbar" id="tools" hidden><button id="refresh">刷新数据</button><button id="plans">设备计划</button><button id="lock">锁定</button></div></header>
<form id="unlock"><h2>解锁定位数据</h2><p>公开页面只存储加密状态。密码仅在当前页面内存中使用，不会写入地址栏或浏览器存储。</p><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" minlength="12" required><button class="primary">进入工作台</button></form>
<div id="status" class="status" role="status" aria-live="polite" hidden></div><section id="summary" class="summary" hidden></section><section id="device-section" hidden><div class="section-head"><h2>设备状态</h2><p id="updated"></p></div><section id="cards" class="cards"></section></section>
<dialog id="editor"><h2>设备计划</h2><p>这里展示当前计划并可导出。网页不保存 GitHub 凭据，计划修改后需通过部署工具提交。</p><textarea id="plantext" aria-label="设备计划 JSON"></textarea><p id="planerror" class="warn-text"></p><div class="dialog-actions"><button class="primary" id="download">下载计划</button><button id="close">关闭</button></div></dialog>
<script type="module" src="app.js"></script></main></html>
