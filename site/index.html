<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f6f8">
<title>定位工作台</title>
<link rel="stylesheet" href="management.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" aria-label="工作台侧栏">
    <a class="brand" href="./" aria-label="定位工作台首页"><span class="brand-mark" aria-hidden="true">L</span><span><strong>定位工作台</strong><small>LOCATION DESK</small></span></a>
    <nav id="primary-navigation" class="primary-navigation" aria-label="主导航" hidden>
      <p class="nav-caption">工作区</p>
      <button type="button" class="nav-item active" data-view="overview" aria-current="page"><span class="nav-icon" aria-hidden="true">⌂</span><span>设备总览</span></button>
      <button type="button" class="nav-item" data-view="plans" aria-current="false"><span class="nav-icon" aria-hidden="true">◷</span><span>采集计划</span></button>
      <button type="button" class="nav-item" data-view="reports" aria-current="false"><span class="nav-icon" aria-hidden="true">▤</span><span>月度报告</span></button>
      <button type="button" class="nav-item" data-view="settings" aria-current="false"><span class="nav-icon" aria-hidden="true">⚙</span><span>系统设置</span></button>
    </nav>
    <div class="sidebar-note"><span class="cloud-dot" aria-hidden="true"></span><span><strong>云端工作台</strong><small>可在设备关机时访问</small></span></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div><p class="eyebrow">云端设备管理</p><h1>定位工作台</h1><p class="subtitle">查看设备状态、采集计划与月度报告</p></div>
      <div class="toolbar" id="tools" hidden>
        <button id="refresh" class="button button-secondary" type="button"><span aria-hidden="true">↻</span> 刷新数据</button>
        <button id="plans" class="button button-secondary" type="button">计划 JSON</button>
        <button id="lock" class="button button-quiet" type="button">锁定</button>
      </div>
    </header>

    <form id="unlock" class="unlock-card">
      <div class="unlock-icon" aria-hidden="true">⌑</div>
      <p class="eyebrow">安全访问</p><h2>解锁定位数据</h2>
      <p>定位数据以加密形式发布。访问密码仅在本页面内存中使用，不会写入地址栏或浏览器存储。</p>
      <label for="password">访问密码</label>
      <input id="password" type="password" autocomplete="current-password" minlength="12" required>
      <button class="button button-primary" type="submit">进入工作台 <span aria-hidden="true">→</span></button>
      <small class="privacy-note">请勿在公共或他人设备上保存密码。</small>
    </form>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section id="overview" class="view-panel" data-view-panel="overview" aria-label="设备总览" hidden>
      <div class="section-intro"><div><p class="eyebrow">一览</p><h2>设备总览</h2><p>位置时间与采集时间分开展示；历史数据不会标记为实时。</p></div><p id="updated" class="updated-label"></p></div>
      <section id="summary" class="summary" aria-label="设备数据摘要" hidden></section>
      <section class="overview-surface">
        <div class="section-head"><div><h3>设备状态</h3><p>选择卡片中的地图链接查看最后记录的位置</p></div></div>
        <p id="schedule-summary" class="schedule-summary" hidden></p>
        <section id="device-section" hidden><section id="cards" class="cards"></section></section>
      </section>
    </section>

    <section id="management" hidden aria-label="计划、报告和系统设置"></section>

    <dialog id="editor" class="plan-dialog"><h2>计划 JSON</h2><p>此文件仅用于导出备份，不会直接保存到仓库。通过“采集计划”中的加密提交操作发布更改；云端确认后才会生效。</p><textarea id="plantext" aria-label="设备计划 JSON" spellcheck="false"></textarea><p id="planerror" class="warn-text" role="status"></p><div class="dialog-actions"><button class="button button-primary" id="download" type="button">下载 JSON</button><button class="button button-secondary" id="close" type="button">关闭</button></div></dialog>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
